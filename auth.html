<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сабақтар базасы — Кіру және Тіркелу (Firebase)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #loginQrCode img, #loginQrCode canvas { border-radius: 12px; margin: 0 auto; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-slate-50 to-blue-50/40 min-h-screen text-slate-900 flex flex-col justify-between p-4 sm:p-6">

  <header class="max-w-4xl mx-auto w-full flex items-center justify-between py-2 mb-4">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-sm shadow-sm">
        СБ
      </div>
      <div>
        <h1 class="font-bold text-sm text-slate-900 leading-tight">Сабақтар базасы</h1>
        <p class="text-[11px] text-slate-500">Firebase Firestore • Нақты уақыттағы дерекқор</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-50 text-amber-800 text-xs font-semibold border border-amber-200">
        <i class="fa-solid fa-fire text-amber-600"></i>
        <span>Firebase қосылған</span>
      </span>
    </div>
  </header>

  <main class="max-w-md mx-auto w-full bg-white rounded-3xl border border-slate-200 shadow-xl p-6 sm:p-8">
    
    <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
      <button id="tabLoginBtn" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-slate-900 shadow-xs transition-all cursor-pointer">
        Кіру
      </button>
      <button id="tabRegisterBtn" class="flex-1 py-2 text-xs font-medium text-slate-600 rounded-lg hover:text-slate-900 transition-all cursor-pointer">
        Тіркелу
      </button>
      <button id="tabQrBtn" class="flex-1 py-2 text-xs font-medium text-slate-600 rounded-lg hover:text-slate-900 transition-all cursor-pointer flex items-center justify-center gap-1">
        <i class="fa-solid fa-qrcode text-[10px]"></i>
        <span>QR код</span>
      </button>
    </div>

    <!-- КІРУ -->
    <div id="formLogin">
      <h2 class="text-xl font-bold text-slate-900 mb-1">Жүйеге кіру</h2>
      <p class="text-xs text-slate-500 mb-5">Firebase тіркелгіңізбен немесе Google арқылы кіріңіз</p>

      <button type="button" id="googleLoginBtn" class="w-full py-2.5 px-4 mb-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-xs flex items-center justify-center gap-2.5 transition-all shadow-xs cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Google аккаунтымен бір басумен кіру</span>
      </button>

      <form id="emailLoginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Электрондық пошта (Email) *</label>
          <input type="email" id="loginEmail" required placeholder="temirzhanmerei06@gmail.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm focus:outline-none focus:border-blue-600" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Құпиясөз *</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm focus:outline-none focus:border-blue-600" />
        </div>

        <button type="submit" id="loginBtn" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm shadow-md transition-all cursor-pointer">
          Кіру
        </button>
      </form>
    </div>

    <!-- ТІРКЕЛУ -->
    <div id="formRegister" class="hidden">
      <h2 class="text-xl font-bold text-slate-900 mb-1">Жаңа аккаунт ашу</h2>
      <p class="text-xs text-slate-500 mb-5">Firebase Authentication арқылы тіркелу</p>

      <form id="emailRegisterForm" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Толық аты-жөніңіз *</label>
          <input type="text" id="regName" required placeholder="Мерей Т." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-blue-600" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Электрондық пошта (Email) *</label>
          <input type="email" id="regEmail" required placeholder="merei@gmail.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-blue-600" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Құпиясөз *</label>
          <input type="password" id="regPassword" required minlength="6" placeholder="Кемінде 6 таңба" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-blue-600" />
        </div>

        <button type="submit" id="regBtn" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm shadow-md transition-all cursor-pointer">
          Тіркелу
        </button>
      </form>
    </div>

    <!-- QR КОД -->
    <div id="formQr" class="hidden text-center">
      <h3 class="text-base font-bold text-slate-900 mb-2">Телефон камерасымен кіру</h3>
      <div class="p-3 bg-slate-50 rounded-2xl border-2 border-slate-200 inline-block mb-3">
        <div id="loginQrCode"></div>
      </div>
      <p class="text-xs text-slate-500">Таймер: <strong id="qrTimer" class="text-emerald-700 font-bold">120</strong> сек</p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      updateProfile, 
      signInWithPopup, 
      GoogleAuthProvider, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "sabaktar-bazasy",
      appId: "1:659458804570:web:ab9d14e008afc86cf28163",
      apiKey: "AIzaSyBsG8TJJDtbcfdRjXXUsHEXDtW62zCZo4Y",
      authDomain: "sabaktar-bazasy.firebaseapp.com",
      firestoreDatabaseId: "ai-studio-qr-fb4cebab-7d66-428f-b60e-a0e1f6d61b02",
      storageBucket: "sabaktar-bazasy.firebasestorage.app",
      messagingSenderId: "659458804570"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app, "ai-studio-qr-fb4cebab-7d66-428f-b60e-a0e1f6d61b02");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    window.switchTab = function(tab) {
      document.getElementById("formLogin").classList.toggle("hidden", tab !== 'login');
      document.getElementById("formRegister").classList.toggle("hidden", tab !== 'register');
      document.getElementById("formQr").classList.toggle("hidden", tab !== 'qr');
    };

    document.getElementById("tabLoginBtn").onclick = () => window.switchTab('login');
    document.getElementById("tabRegisterBtn").onclick = () => window.switchTab('register');
    document.getElementById("tabQrBtn").onclick = () => window.switchTab('qr');

    document.getElementById("googleLoginBtn").onclick = async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (err) { alert(err.message); }
    };

    document.getElementById("emailLoginForm").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value.trim(), document.getElementById("loginPassword").value);
      } catch (err) { alert("Кіру қатесі: " + err.message); }
    };

    document.getElementById("emailRegisterForm").onsubmit = async (e) => {
      e.preventDefault();
      try {
        const cred = await createUserWithEmailAndPassword(auth, document.getElementById("regEmail").value.trim(), document.getElementById("regPassword").value);
        await updateProfile(cred.user, { displayName: document.getElementById("regName").value.trim() });
      } catch (err) { alert("Тіркелу қатесі: " + err.message); }
    };
  </script>
</body>
</html>
