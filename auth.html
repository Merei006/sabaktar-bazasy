<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тіркелу / Кіру — Материалдар базасы</title>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --ink: #14213d;
      --muted: #5b6679;
      --brand: #14213d;
      --brand-ink: #f4f7fb;
      --accent: #e8a33d;
      --error: #c0392b;
      --ok: #2f8f5b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    h1 { font-size: 1.5rem; margin-bottom: 6px; text-align: center; }
    .sub { text-align: center; color: var(--muted); font-size: 0.95rem; margin-bottom: 24px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .tabs button {
      flex: 1; padding: 10px; border: none; border-radius: 10px;
      background: #e8edf5; color: var(--ink); font-weight: 600; cursor: pointer;
    }
    .tabs button.active { background: var(--brand); color: var(--brand-ink); }
    label { display: block; font-size: 0.9rem; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #d5dce6;
      border-radius: 10px; font-size: 1rem; margin-bottom: 16px; background: #f8fafc;
    }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: var(--brand); color: var(--brand-ink); font-size: 1rem;
      font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      margin-top: 16px; padding: 12px; border-radius: 10px;
      font-size: 0.9rem; text-align: center; display: none;
    }
    .msg.error { background: #fdecea; color: var(--error); display: block; }
    .msg.success { background: #e8f8f0; color: var(--ok); display: block; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Материалдар базасы</h1>
    <p class="sub">Тіркеліп, материалдарды көріңіз және қосыңыз</p>

    <div class="tabs">
      <button type="button" id="tabLogin" class="active">Кіру</button>
      <button type="button" id="tabRegister">Тіркелу</button>
    </div>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="loginEmail" required placeholder="email@example.com">
      <label>Пароль</label>
      <input type="password" id="loginPassword" required placeholder="••••••••" minlength="6">
      <button type="submit" class="btn" id="loginBtn">Кіру</button>
    </form>

    <form id="registerForm" class="hidden">
      <label>Email</label>
      <input type="email" id="regEmail" required placeholder="email@example.com">
      <label>Пароль</label>
      <input type="password" id="regPassword" required placeholder="Кемінде 6 таңба" minlength="6">
      <label>Парольді қайталаңыз</label>
      <input type="password" id="regPassword2" required placeholder="Парольді қайталаңыз" minlength="6">
      <button type="submit" class="btn" id="regBtn">Тіркелу</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBsG8TJJDtbcfdRjXXUsHEXDtW62zCZo4Y",
      authDomain: "sabaktar-bazasy.firebaseapp.com",
      projectId: "sabaktar-bazasy",
      storageBucket: "sabaktar-bazasy.firebasestorage.app",
      messagingSenderId: "659458804570",
      appId: "1:659458804570:web:7774accb2ff03204f28163"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const msg = document.getElementById("msg");

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = "msg " + type;
    }

    tabLogin.onclick = () => {
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
      msg.className = "msg";
    };

    tabRegister.onclick = () => {
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      msg.className = "msg";
    };

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "Күтіңіз...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showMsg("Сәтті кірдіңіз!", "success");
        setTimeout(() => window.location.href = "index.html", 700);
      } catch (err) {
        let text = "Қате пайда болды";
        if (err.code === "auth/user-not-found" || err.code === "auth/invalid-credential") text = "Email немесе пароль қате";
        if (err.code === "auth/wrong-password") text = "Пароль қате";
        if (err.code === "auth/invalid-email") text = "Email дұрыс емес";
        showMsg(text, "error");
        btn.disabled = false;
        btn.textContent = "Кіру";
      }
    };

    registerForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const password2 = document.getElementById("regPassword2").value;
      const btn = document.getElementById("regBtn");

      if (password !== password2) {
        showMsg("Парольдер сәйкес емес", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Тіркелуде...";

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        showMsg("Тіркелу сәтті аяқталды!", "success");
        setTimeout(() => window.location.href = "index.html", 700);
      } catch (err) {
        let text = "Қате пайда болды";
        if (err.code === "auth/email-already-in-use") text = "Бұл email әлдеқашан тіркелген";
        if (err.code === "auth/invalid-email") text = "Email дұрыс емес";
        if (err.code === "auth/weak-password") text = "Пароль тым әлсіз (кемінде 6 таңба)";
        showMsg(text, "error");
        btn.disabled = false;
        btn.textContent = "Тіркелу";
      }
    };
  </script>
</body>
</html>
