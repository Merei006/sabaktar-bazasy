<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тіркелу / Кіру — Сабақтар базасы</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-3xl border border-slate-200 shadow-xl max-w-md w-full p-6 sm:p-8">
    <!-- Бас тақырып -->
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center font-bold text-lg mx-auto mb-3 shadow-sm">
        СБ
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Сабақтар базасы</h1>
      <p class="text-xs text-slate-500 mt-1">Мұғалімдердің жеке оқшауланған материалдар қоры</p>
    </div>

    <!-- Тілмелер (Кіру / Тіркелу) -->
    <div class="flex bg-slate-100 p-1 rounded-2xl mb-6 text-xs font-semibold">
      <button type="button" id="tabLogin" class="flex-1 py-2.5 rounded-xl bg-white text-slate-900 shadow-xs cursor-pointer">
        Кіру
      </button>
      <button type="button" id="tabRegister" class="flex-1 py-2.5 rounded-xl text-slate-600 hover:text-slate-900 cursor-pointer">
        Тіркелу
      </button>
    </div>

    <!-- Хабарлама -->
    <div id="msg" class="hidden mb-4 p-3 rounded-xl text-xs flex items-center gap-2"></div>

    <!-- Кіру формасы -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email пошта</label>
        <div class="relative">
          <i class="fa-regular fa-envelope text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-xs"></i>
          <input type="email" id="loginEmail" required placeholder="email@example.com" class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm bg-slate-50 focus:bg-white focus:outline-none focus:border-slate-800" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Құпиясөз</label>
        <div class="relative">
          <i class="fa-solid fa-lock text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-xs"></i>
          <input type="password" id="loginPassword" required placeholder="••••••••" minlength="6" class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm bg-slate-50 focus:bg-white focus:outline-none focus:border-slate-800" />
        </div>
      </div>

      <button type="submit" id="loginBtn" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-md transition-all cursor-pointer">
        Жүйеге кіру
      </button>
    </form>

    <!-- Тіркелу формасы -->
    <form id="registerForm" class="hidden space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email пошта</label>
        <div class="relative">
          <i class="fa-regular fa-envelope text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-xs"></i>
          <input type="email" id="regEmail" required placeholder="email@example.com" class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm bg-slate-50 focus:bg-white focus:outline-none focus:border-slate-800" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Құпиясөз</label>
        <div class="relative">
          <i class="fa-solid fa-lock text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-xs"></i>
          <input type="password" id="regPassword" required placeholder="Кемінде 6 таңба" minlength="6" class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm bg-slate-50 focus:bg-white focus:outline-none focus:border-slate-800" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Құпиясөзді қайталаңыз</label>
        <div class="relative">
          <i class="fa-solid fa-lock text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 text-xs"></i>
          <input type="password" id="regPassword2" required placeholder="Құпиясөзді қайта теріңіз" minlength="6" class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm bg-slate-50 focus:bg-white focus:outline-none focus:border-slate-800" />
        </div>
      </div>

      <button type="submit" id="regBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-md transition-all cursor-pointer">
        Жеке қор ашып тіркелу
      </button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBsG8TJJDtbcfdRjXXUsHEXDtW62zCZo4Y",
      authDomain: "sabaktar-bazasy.firebaseapp.com",
      projectId: "sabaktar-bazasy",
      storageBucket: "sabaktar-bazasy.firebasestorage.app",
      messagingSenderId: "659458804570",
      appId: "1:659458804570:web:7774accb2ff03204f28163"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      if (user) {
        window.location.href = "index.html";
      }
    });

    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const msg = document.getElementById("msg");

    function showMsg(text, isError = true) {
      msg.textContent = text;
      msg.className = isError 
        ? "mb-4 p-3 rounded-xl text-xs flex items-center gap-2 bg-red-50 text-red-700 border border-red-200"
        : "mb-4 p-3 rounded-xl text-xs flex items-center gap-2 bg-emerald-50 text-emerald-800 border border-emerald-200";
    }

    tabLogin.onclick = () => {
      tabLogin.className = "flex-1 py-2.5 rounded-xl bg-white text-slate-900 shadow-xs cursor-pointer";
      tabRegister.className = "flex-1 py-2.5 rounded-xl text-slate-600 hover:text-slate-900 cursor-pointer";
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
      msg.classList.add("hidden");
    };

    tabRegister.onclick = () => {
      tabRegister.className = "flex-1 py-2.5 rounded-xl bg-white text-slate-900 shadow-xs cursor-pointer";
      tabLogin.className = "flex-1 py-2.5 rounded-xl text-slate-600 hover:text-slate-900 cursor-pointer";
      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      msg.classList.add("hidden");
    };

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const btn = document.getElementById("loginBtn");

      btn.disabled = true;
      btn.textContent = "Күтіңіз...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showMsg("Сәтті кірдіңіз!", false);
        setTimeout(() => window.location.href = "index.html", 400);
      } catch (err) {
        let text = "Кіру қатесі";
        if (err.code === "auth/user-not-found" || err.code === "auth/invalid-credential") text = "Email немесе құпиясөз қате";
        if (err.code === "auth/wrong-password") text = "Құпиясөз дұрыс емес";
        if (err.code === "auth/invalid-email") text = "Email форматы дұрыс емес";
        showMsg(text, true);
        btn.disabled = false;
        btn.textContent = "Жүйеге кіру";
      }
    };

    registerForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const password2 = document.getElementById("regPassword2").value;
      const btn = document.getElementById("regBtn");

      if (password !== password2) {
        showMsg("Құпиясөздер бір-біріне сәйкес келмейді", true);
        return;
      }

      btn.disabled = true;
      btn.textContent = "Тіркелуде...";

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        showMsg("Тіркелу сәтті аяқталды!", false);
        setTimeout(() => window.location.href = "index.html", 500);
      } catch (err) {
        let text = "Тіркелу мүмкін болмады";
        if (err.code === "auth/email-already-in-use") text = "Бұл Email пошта тіркелген";
        if (err.code === "auth/weak-password") text = "Құпиясөз кемінде 6 таңба болуы керек";
        if (err.code === "auth/invalid-email") text = "Email форматы дұрыс емес";
        showMsg(text, true);
        btn.disabled = false;
        btn.textContent = "Жеке қор ашып тіркелу";
      }
    };
  </script>
</body>
</html>
